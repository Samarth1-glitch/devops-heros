name: Session 16 Python CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/session16-ci.yml'
      - 'session-16-github-actions/session-16-github-actions/demo/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/session16-ci.yml'
      - 'session-16-github-actions/session-16-github-actions/demo/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: session-16-github-actions/session-16-github-actions/demo

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Build application
        run: bash build.sh
      - name: Show build output
        run: |
          ls -la build
          cat build/build-info.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: session-16-github-actions/session-16-github-actions/demo/build/